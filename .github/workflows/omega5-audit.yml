name: Omega5 dependency audit

on:
  push:
    branches:
      - aiw-omega5-lockgen-final

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Capture npm audit JSON
        run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: omega5-npm-audit
          path: npm-audit.json
          if-no-files-found: error
