name: IRP-1 CI

on:
  push:
    branches:
      - main
      - aiw-omega3-final-verify-v2
      - aiw-omega4-final-verify-v2
      - aiw-omega5-final-verify-v3
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Deterministic protocol, policy, demo, and Hedera boundary tests
        run: npm test
