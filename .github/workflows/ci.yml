name: IRP-1 CI

on:
  push:
    branches:
      - main
      - aiw-omega3-final-verify-v2
      - aiw-omega4-final-verify-v2
      - aiw-omega5-final-verify-v3
      - aiw-omega6-final-verify-v1
      - aiw-omega6-final-verify-v2
      - aiw-omega6-final-verify-v3
      - aiw-omega6-final-verify-v4
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Deterministic protocol, policy, demo, Hedera, and verifier tests
        run: npm test
      - name: Independent live Hedera Mirror verification
        run: npm run verify:public -- network
