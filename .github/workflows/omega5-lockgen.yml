name: Omega5 lockfile generator

on:
  push:
    branches:
      - aiw-omega5-lockgen-final

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Add exact Hiero SDK dependency
        run: npm install --save-exact @hiero-ledger/sdk@2.87.0
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(omega5): generate Hiero SDK lockfile"
          git push origin HEAD:aiw-omega5-lockgen-final
