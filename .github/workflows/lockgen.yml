name: Phase 2 lock generation

on:
  push:
    branches:
      - aiw-omega2-lockgen

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve pinned development dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: phase2-package-lock
          path: package-lock.json
          if-no-files-found: error
