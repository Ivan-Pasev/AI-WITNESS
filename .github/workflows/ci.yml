name: IRP-1 CI

on:
  push:
    branches:
      - main
      - 'aiw-omega*-final-verify-*'
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Deterministic protocol, policy, demo, Hedera, and verifier tests
        run: npm test
      - name: Independent local policy replay verification
        run: npm run verify:public -- local
      - name: Independent live Hedera Mirror verification
        run: npm run verify:public -- network
      - name: Install locked Agent Kit integration dependencies
        run: npm ci --prefix integrations/hedera-agent-kit
      - name: Agent Kit integration dependency audit
        run: npm audit --prefix integrations/hedera-agent-kit
      - name: Agent Kit integration typecheck
        run: npm run typecheck --prefix integrations/hedera-agent-kit
      - name: Agent Kit / MCP integration tests
        run: npm test --prefix integrations/hedera-agent-kit
