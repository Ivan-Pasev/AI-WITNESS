name: Omega5 hardened-SDK lockfile probe

on:
  push:
    branches:
      - aiw-omega5-lockgen-final

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pin current Hiero SDK and safe transitive overrides
        run: |
          npm install --save-exact @hiero-ledger/sdk@2.87.0
          npm pkg set overrides.protobufjs=8.6.6
          npm pkg set overrides.ws=8.21.0
          npm install
      - name: Capture candidate audit
        run: npm audit --json > npm-audit-hardened.json || true
      - name: Persist hardened package metadata on probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Package metadata already hardened."
          else
            git commit -m "chore(omega5): persist hardened SDK lockfile"
            git push origin HEAD:aiw-omega5-lockgen-final
          fi
      - name: Upload generated package metadata
        uses: actions/upload-artifact@v4
        with:
          name: omega5-package-metadata-hardened
          path: |
            package.json
            package-lock.json
            npm-audit-hardened.json
          if-no-files-found: error
