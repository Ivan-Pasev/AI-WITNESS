name: Omega5 safe-SDK lockfile probe

on:
  push:
    branches:
      - aiw-omega5-lockgen-final

permissions:
  contents: read

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pin candidate Hiero SDK dependency
        run: npm install --save-exact @hiero-ledger/sdk@2.81.0
      - name: Capture candidate audit
        run: npm audit --json > npm-audit-281.json || true
      - name: Upload generated package metadata
        uses: actions/upload-artifact@v4
        with:
          name: omega5-package-metadata-281
          path: |
            package.json
            package-lock.json
            npm-audit-281.json
          if-no-files-found: error
