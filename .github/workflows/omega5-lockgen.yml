name: Omega5 lockfile generator

on:
  push:
    branches:
      - aiw-omega5-lockgen-final

permissions:
  contents: read

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Add exact Hiero SDK dependency
        run: npm install --save-exact @hiero-ledger/sdk@2.87.0
      - name: Upload generated package metadata
        uses: actions/upload-artifact@v4
        with:
          name: omega5-package-metadata
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
